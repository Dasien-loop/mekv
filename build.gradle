plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'mekv.verifyMixins', 'true'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    flatDir { dir 'libs' }
}

dependencies {
    implementation files('libs/easy-villagers-neoforge-1.21.1-1.1.42.jar')
    implementation files('libs/Mekanism-1.21.1-10.7.19.85.jar')
    implementation files('libs/MekanismGenerators-1.21.1-10.7.19.85.jar')
    compileOnly files('libs/mekanism_extras-1.21.1-1.4.1.jar')
    if (!providers.gradleProperty('withoutExtras').isPresent()) {
        runtimeOnly files('libs/mekanism_extras-1.21.1-1.4.1.jar')
    }

    runtimeOnly fileTree(dir: 'libs', include: '*.jar', exclude: [
            'jei-*.jar',
            'mekanism_extras-*.jar',
            'jecharacters-*.jar'
    ])
    // JEI and JECharacters are explicit NeoForge 1.21.1 test dependencies.
    runtimeOnly files('libs/jei-1.21.1-neoforge-19.39.0.368.jar')
    runtimeOnly files('libs/jecharacters-1.21.1-neoforge-4.5.27.jar')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('tradeUiTest', JavaExec) {
    group = 'verification'
    description = 'Checks trade list rendering/click/tooltip bounds without launching Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dasien.mekv.client.screen.TradeListLayoutTest'
}

tasks.register('tradeInputTest', JavaExec) {
    group = 'verification'
    description = 'Checks trader distribution, reservations and remainder recovery.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dasien.mekv.blockentity.TradeInputPlannerTest'
}

tasks.named('test') {
    dependsOn tasks.named('tradeInputTest')
}

tasks.named('check') {
    dependsOn tasks.named('tradeUiTest')
    dependsOn tasks.named('tradeInputTest')
}


