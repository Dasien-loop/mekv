modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="mekv.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
type="required"
versionRange="[10.7,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanismgenerators"
type="required"
versionRange="[10.7,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="easy_villagers"
type="required"
versionRange="[1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism_extras"
type="optional"
versionRange="[1.4.1,)"
ordering="AFTER"
side="BOTH"
